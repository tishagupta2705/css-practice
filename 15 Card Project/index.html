<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mini-Project: Profile Cards</title>
     <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    
    <header>
        <h1>Our Staff</h1>
        <nav>
            <a href="#profile1">Ros</a>
            <a href="#profile2">Matt</a>
            <a href="#profile3">san</a>
        </nav>
    </header>

    <main>
        <article id="Profile1" class="card">
            <figure>
                <img src="img/profile1-500x500.png" alt="Ros Coder" width="500" height="500" />
                <figcaption>Ros Coder</figcaption>
            </figure>
            <p><q>I code Stuff.</q></p>
        </article>

        <article id="Profile2" class="card">
            <figure>
                <img src="img/profile2-500x500.png" alt="Matt Desginer" width="500" height="500" />
                <figcaption>Matt Desginer</figcaption>
            </figure>
            <p><q>I Desgine Stuff.</q></p>
        </article>

        <article id="Profile3" class="card">
            <figure>
                <img src="img/profile3-500x500.png" alt="San dev" width="500" height="500">
                <figcaption>San <span class="nowrap">Dev</span> Rel</figcaption>
            </figure>
            <p><q>I teach Stuff.</q></p>
        </article>
    </main>

    <footer>
        <p>&copy; ACME Co.</p>
    </footer>

</body>
</html>
